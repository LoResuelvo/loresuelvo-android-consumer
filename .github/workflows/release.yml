name: Release
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  actions: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Set build version
        shell: bash
        run: |
          echo "VERSION_CODE=$((200000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Create Gradle Properties
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<EOF
          # ==========================================
          # STAGING
          # ==========================================
          AUTH0_DOMAIN_STAGING=${{ secrets.AUTH0_DOMAIN_STAGING }}
          AUTH0_CLIENT_ID_STAGING=${{ secrets.AUTH0_CLIENT_ID_STAGING }}
          AUTH0_CLIENT_SECRET_STAGING=${{ secrets.AUTH0_CLIENT_SECRET_STAGING }}
          AUTH0_AUDIENCE_STAGING=${{ secrets.AUTH0_AUDIENCE_STAGING }}
          AUTH0_SCHEME_STAGING=com.loresuelvo.consumer.staging
          API_URL_STAGING=${{ secrets.API_URL_STAGING }}
          PUBLIC_MEDIA_BASE_URL_STAGING=${{ secrets.NEXT_PUBLIC_PUBLIC_MEDIA_BASE_URL_STAGING }}

          # ==========================================
          # PRODUCTION
          # ==========================================
          AUTH0_DOMAIN_PROD=${{ secrets.AUTH0_DOMAIN_PROD }}
          AUTH0_CLIENT_ID_PROD=${{ secrets.AUTH0_CLIENT_ID_PROD }}
          AUTH0_CLIENT_SECRET_PROD=${{ secrets.AUTH0_CLIENT_SECRET_PROD }}
          AUTH0_AUDIENCE_PROD=${{ secrets.AUTH0_AUDIENCE_PROD }}
          AUTH0_SCHEME_PROD=com.loresuelvo.consumer
          API_URL_PROD=${{ secrets.API_URL_PROD }}
          PUBLIC_MEDIA_BASE_URL_PROD=${{ secrets.NEXT_PUBLIC_PUBLIC_MEDIA_BASE_URL_PROD }}
          EOF

      - name: Run staging JVM tests and build artifacts
        run: ./gradlew :app:testStagingDebugUnitTest :app:assembleStagingDebug :app:bundleProdRelease --no-daemon

      - name: Upload Staging APK
        uses: actions/upload-artifact@v4
        with:
          name: staging-apk
          path: app/build/outputs/apk/staging/debug/*.apk

      - name: Upload Production Bundle
        uses: actions/upload-artifact@v4
        with:
          name: prod-aab
          path: app/build/outputs/bundle/prodRelease/*.aab

  release-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Download Staging APK
        uses: actions/download-artifact@v4
        with:
          name: staging-apk
          path: artifacts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Configure Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          credentials_file="$RUNNER_TEMP/firebase-service-account.json"
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$credentials_file"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$credentials_file" >> "$GITHUB_ENV"

      - name: Upload staging APK to Firebase App Distribution
        env:
          FIREBASE_APP_ID_STAGING: ${{ vars.FIREBASE_APP_ID_STAGING }}
          FIREBASE_TESTERS_STAGING: ${{ vars.FIREBASE_TESTERS_STAGING }}
        shell: bash
        run: |
          test -n "$FIREBASE_APP_ID_STAGING"
          test -n "$FIREBASE_TESTERS_STAGING"

          apk_path="$(find artifacts -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk_path"

          firebase appdistribution:distribute "$apk_path" \
            --app "$FIREBASE_APP_ID_STAGING" \
            --groups "$FIREBASE_TESTERS_STAGING" \
            --release-notes "Staging ${GITHUB_REF_NAME} (${GITHUB_SHA::7})"

  release-prod:
    needs: release-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download Production Bundle
        uses: actions/download-artifact@v4
        with:
          name: prod-aab
          path: artifacts

      - name: Show generated artifact
        run: |
          echo "Production release generated successfully"
          ls -la artifacts

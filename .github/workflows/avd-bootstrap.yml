name: Bootstrap CI AVD

on:
  workflow_dispatch:
    inputs:
      cache_version:
        description: Version of the prewarmed AVD cache; increment it to regenerate the cache
        required: true
        default: v2
        type: string

permissions:
  contents: read
  actions: write

jobs:
  prepare-avd:
    name: Prepare clean AVD snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Habilitar KVM (requerido por el emulador)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Create and prewarm AVD snapshot
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          avd-name: test
          force-avd-creation: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -no-snapshot-save
          script: |
            echo "E2E_BOOTSTRAP_SNAPSHOT_START=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            adb -s emulator-5554 emu avd snapshot save ci-clean
            adb -s emulator-5554 emu avd snapshot list
            adb -s emulator-5554 emu avd snapshot list | grep -q 'ci-clean' || { echo "Snapshot ci-clean was not created"; exit 1; }
            echo "E2E_BOOTSTRAP_SNAPSHOT_AVAILABLE=true"

      - name: Save prewarmed AVD cache
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.android/avd/test.avd
            ~/.android/avd/test.ini
          key: ${{ runner.os }}-avd-api34-x86_64-pixel6-${{ inputs.cache_version }}

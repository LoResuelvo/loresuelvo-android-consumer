name: Bootstrap CI AVD

on:
  workflow_dispatch:
    inputs:
      cache_version:
        description: Version of the prewarmed AVD cache; increment it to regenerate the cache
        required: true
        default: v2
        type: string

permissions:
  contents: read
  actions: write

jobs:
  prepare-avd:
    name: Prepare clean AVD snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Habilitar KVM (requerido por el emulador)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Create and prewarm AVD snapshot
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          avd-name: test
          force-avd-creation: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -no-snapshot-save
          script: |
            echo "E2E_BOOTSTRAP_SNAPSHOT_START=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            adb -s emulator-5554 emu avd snapshot save ci-clean
            i=0; while [ "$i" -lt 60 ]; do if adb -s emulator-5554 emu avd snapshot list | grep -q 'ci-clean'; then exit 0; fi; i=$((i + 1)); sleep 1; done; echo "Snapshot ci-clean was not created within 60 seconds"; exit 1
            adb -s emulator-5554 emu avd snapshot list
            echo "E2E_BOOTSTRAP_SNAPSHOT_AVAILABLE=true"

      - name: Wait for emulator shutdown before caching
        run: |
          set -eu
          i=0
          while adb -s emulator-5554 get-state >/dev/null 2>&1; do
            if [ "$i" -ge 60 ]; then
              echo "The emulator did not shut down within 60 seconds"
              exit 1
            fi
            i=$((i + 1))
            sleep 1
          done
          sleep 2

      - name: Verify AVD files before caching
        env:
          AVD_CACHE_KEY: ${{ runner.os }}-avd-api34-x86_64-pixel6-${{ inputs.cache_version }}
        run: |
          set -eu
          avd_home="${ANDROID_AVD_HOME:-$HOME/.android/avd}"
          echo "PWD=$PWD"
          echo "ANDROID_AVD_HOME=${ANDROID_AVD_HOME:-<unset>}"
          echo "AVD_HOME_EFFECTIVE=$avd_home"
          echo "AVD_CACHE_KEY=$AVD_CACHE_KEY"
          echo "--- AVD directory ---"
          ls -lah "$avd_home"
          echo "--- test.ini ---"
          test -f "$avd_home/test.ini"
          ls -lah "$avd_home/test.ini"
          echo "--- test.avd ---"
          test -d "$avd_home/test.avd"
          ls -lah "$avd_home/test.avd"
          echo "--- snapshot-related files ---"
          find "$avd_home/test.avd" -maxdepth 3 -type f \( -name 'snapshots*.img' -o -path '*/snapshots/*' \) -print -exec ls -lh {} \;

      - name: Save prewarmed AVD cache
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.android/avd/test.avd
            ~/.android/avd/test.ini
          key: ${{ runner.os }}-avd-api34-x86_64-pixel6-${{ inputs.cache_version }}

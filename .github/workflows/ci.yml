name: CI Build & Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Path-sensor for the instrumented-tests job: the emulator still has a startup
  # cost, so we only pay it on PRs that actually touch UI/Composable code,
  # the AndroidManifest, or the build configuration. Lint + unit
  # tests and the APK build verification are cheap enough to run
  # unconditionally.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      instrumented: ${{ steps.filter.outputs.instrumented }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            instrumented:
              - 'app/src/main/**'
              - 'app/src/androidTest/**'
              - 'app/src/main/AndroidManifest.xml'
              - 'app/build.gradle.kts'
              - 'gradle/libs.versions.toml'
              - '.github/workflows/ci.yml'
              - 'makefile'
              - 'scripts/run_instrumented_tests.sh'

  lint-and-unit:
    name: Lint + Unit Tests
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Ejecutar Lint y Unit Tests
        env:
          AUTH0_DOMAIN_STAGING: ${{ secrets.AUTH0_DOMAIN_STAGING }}
          AUTH0_CLIENT_ID_STAGING: ${{ secrets.AUTH0_CLIENT_ID_STAGING }}
          AUTH0_AUDIENCE_STAGING: ${{ secrets.AUTH0_AUDIENCE_STAGING }}
          API_URL_STAGING: ${{ secrets.API_URL_STAGING }}
          AUTH0_SCHEME_STAGING: "com.loresuelvo.consumer.staging"
        run: |
          make lint FLAVOR=Staging
          make test FLAVOR=Staging

  instrumented-tests:
    name: Instrumented Tests (Emulator)
    needs: changes
    if: needs.changes.outputs.instrumented == 'true'
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Timing instrumented job start
        run: echo "TIMING:INSTRUMENTED_JOB_START=$(date -u +%s)"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Timing SDK cache start
        run: echo "TIMING:SDK_CACHE_START=$(date -u +%s)"

      - name: Restore Android emulator SDK cache
        id: android-sdk-cache
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/system-images/android-35/default/x86_64
          key: ${{ runner.os }}-android-sdk-managed-device-api35-x86_64-v1
          restore-keys: |
            ${{ runner.os }}-android-sdk-managed-device-api35-x86_64-

      - name: Timing SDK cache end
        run: echo "TIMING:SDK_CACHE_END=$(date -u +%s)"

      - name: Report Android emulator SDK cache
        env:
          ANDROID_SDK_CACHE_HIT: ${{ steps.android-sdk-cache.outputs.cache-hit || 'false' }}
        run: echo "ANDROID_SDK_CACHE_HIT=$ANDROID_SDK_CACHE_HIT"

      - name: Restore prewarmed AVD cache
        id: avd-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /home/runner/.android/avd/test.avd
            /home/runner/.android/avd/test.ini
          key: ${{ runner.os }}-avd-api35-x86_64-pixel2-v1
          restore-keys: |
            ${{ runner.os }}-avd-api35-x86_64-pixel2-

      - name: Report prewarmed AVD cache
        env:
          AVD_CACHE_HIT: ${{ steps.avd-cache.outputs.cache-hit || 'false' }}
        run: echo "AVD_CACHE_HIT=$AVD_CACHE_HIT"

      - name: Habilitar KVM (requerido por el emulador)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Timing instrumented build start
        run: echo "TIMING:INSTRUMENTED_BUILD_START=$(date -u +%s)"

      - name: Build instrumented artifacts
        env:
          AUTH0_DOMAIN_STAGING: ${{ secrets.AUTH0_DOMAIN_STAGING }}
          AUTH0_CLIENT_ID_STAGING: ${{ secrets.AUTH0_CLIENT_ID_STAGING }}
          AUTH0_AUDIENCE_STAGING: ${{ secrets.AUTH0_AUDIENCE_STAGING }}
          API_URL_STAGING: ${{ secrets.API_URL_STAGING }}
          AUTH0_SCHEME_STAGING: "com.loresuelvo.consumer.staging"
        run: ./gradlew assembleStagingDebug assembleStagingDebugAndroidTest

      - name: Timing instrumented build end
        run: echo "TIMING:INSTRUMENTED_BUILD_END=$(date -u +%s)"

      - name: Ejecutar tests instrumentados de Android
        env:
          AVD_CACHE_HIT: ${{ steps.avd-cache.outputs.cache-hit || 'false' }}
          GRADLE_OPTS: -Dorg.gradle.logging.level=info
          AUTH0_DOMAIN_STAGING: ${{ secrets.AUTH0_DOMAIN_STAGING }}
          AUTH0_CLIENT_ID_STAGING: ${{ secrets.AUTH0_CLIENT_ID_STAGING }}
          AUTH0_AUDIENCE_STAGING: ${{ secrets.AUTH0_AUDIENCE_STAGING }}
          API_URL_STAGING: ${{ secrets.API_URL_STAGING }}
          AUTH0_SCHEME_STAGING: "com.loresuelvo.consumer.staging"
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          avd-name: test
          force-avd-creation: false
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -snapshot ci-clean -no-snapshot-save
          script: |
            echo "AVD_CACHE_HIT=$AVD_CACHE_HIT"
            echo "TIMING:INSTRUMENTED_TESTS_START=$(date -u +%s)"
            INSTRUMENTED_DEVICE=connected make instrumented FLAVOR=Staging
            echo "TIMING:INSTRUMENTED_TESTS_END=$(date -u +%s)"

      - name: Timing runner end
        if: always()
        run: |
          echo "TIMING:RUNNER_END=$(date -u +%s)"
          echo "TIMING:INSTRUMENTED_JOB_END=$(date -u +%s)"

  apk-build:
    name: Build APK Staging (verificación)
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build APK
        env:
          AUTH0_DOMAIN_STAGING: ${{ secrets.AUTH0_DOMAIN_STAGING }}
          AUTH0_CLIENT_ID_STAGING: ${{ secrets.AUTH0_CLIENT_ID_STAGING }}
          AUTH0_AUDIENCE_STAGING: ${{ secrets.AUTH0_AUDIENCE_STAGING }}
          API_URL_STAGING: ${{ secrets.API_URL_STAGING }}
          AUTH0_SCHEME_STAGING: "com.loresuelvo.consumer.staging"
        run: make build FLAVOR=Staging

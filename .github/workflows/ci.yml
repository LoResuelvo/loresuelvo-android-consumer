name: CI Build & Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Path-sensor for the e2e job: the emulator boot costs ~5 min so
  # we only pay that on PRs that actually touch UI/Composable code,
  # the AndroidManifest, or the build configuration. Lint + unit
  # tests and the APK build verification are cheap enough to run
  # unconditionally.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            e2e:
              - 'app/src/main/**'
              - 'app/src/androidTest/**'
              - 'app/src/main/AndroidManifest.xml'
              - 'app/build.gradle.kts'
              - 'gradle/libs.versions.toml'
              - '.github/workflows/ci.yml'

  lint-and-unit:
    name: Lint + Unit Tests
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ejecutar Lint y Unit Tests
        env:
          AUTH0_DOMAIN_STAGING: ${{ secrets.AUTH0_DOMAIN_STAGING }}
          AUTH0_CLIENT_ID_STAGING: ${{ secrets.AUTH0_CLIENT_ID_STAGING }}
          AUTH0_AUDIENCE_STAGING: ${{ secrets.AUTH0_AUDIENCE_STAGING }}
          API_URL_STAGING: ${{ secrets.API_URL_STAGING }}
          AUTH0_SCHEME_STAGING: "com.loresuelvo.consumer.staging"
        run: |
          make lint FLAVOR=Staging
          make test FLAVOR=Staging

  e2e:
    name: Acceptance Tests (Emulator)
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Habilitar KVM (requerido por el emulador)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Ejecutar E2E (Android Instrumented Tests)
        uses: ReactiveCircus/android-emulator-runner@v2
        env:
          AUTH0_DOMAIN_STAGING: ${{ secrets.AUTH0_DOMAIN_STAGING }}
          AUTH0_CLIENT_ID_STAGING: ${{ secrets.AUTH0_CLIENT_ID_STAGING }}
          AUTH0_AUDIENCE_STAGING: ${{ secrets.AUTH0_AUDIENCE_STAGING }}
          API_URL_STAGING: ${{ secrets.API_URL_STAGING }}
          AUTH0_SCHEME_STAGING: "com.loresuelvo.consumer.staging"
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          pre-emulator-launch-script: |
            set -eu

            prebuild_pid_file="$RUNNER_TEMP/e2e-prebuild.pid"
            prebuild_log_file="$RUNNER_TEMP/e2e-prebuild.log"
            prebuild_status_file="$RUNNER_TEMP/e2e-prebuild.status"

            : > "$prebuild_log_file"
            rm -f "$prebuild_status_file"

            prebuild_started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "E2E_PREBUILD_START timestamp=$prebuild_started_at"
            echo "E2E_PREBUILD_START timestamp=$prebuild_started_at" >> "$prebuild_log_file"

            (
              set +e
              ./gradlew \
                :app:assembleStagingDebug \
                :app:assembleStagingDebugAndroidTest \
                >> "$prebuild_log_file" 2>&1
              prebuild_status=$?
              prebuild_finished_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "E2E_PREBUILD_FINISH timestamp=$prebuild_finished_at status=$prebuild_status" >> "$prebuild_log_file"
              printf '%s\n' "$prebuild_status" > "$prebuild_status_file"
              exit "$prebuild_status"
            ) &

            printf '%s\n' "$!" > "$prebuild_pid_file"
            echo "E2E_PREBUILD_PID pid=$(cat "$prebuild_pid_file")"

          script: |
            set -eu

            prebuild_pid_file="$RUNNER_TEMP/e2e-prebuild.pid"
            prebuild_log_file="$RUNNER_TEMP/e2e-prebuild.log"
            prebuild_status_file="$RUNNER_TEMP/e2e-prebuild.status"
            prebuild_pid="$(cat "$prebuild_pid_file")"

            echo "Waiting for E2E prebuild pid=$prebuild_pid"

            # The action runs pre-emulator-launch-script and script in separate
            # shells, so bash wait cannot be used across the two shell processes.
            # Polling the recorded PID preserves an explicit wait without racing
            # the background Gradle process.
            while kill -0 "$prebuild_pid" 2>/dev/null; do
              sleep 1
            done

            status_wait_seconds=0
            while [ ! -f "$prebuild_status_file" ] && [ "$status_wait_seconds" -lt 30 ]; do
              sleep 1
              status_wait_seconds=$((status_wait_seconds + 1))
            done

            if [ ! -f "$prebuild_status_file" ]; then
              echo "E2E_PREBUILD_FINISH status=unknown"
              cat "$prebuild_log_file"
              exit 1
            fi

            prebuild_status="$(cat "$prebuild_status_file")"
            cat "$prebuild_log_file"

            if [ "$prebuild_status" != "0" ]; then
              echo "E2E prebuild failed with status=$prebuild_status"
              exit "$prebuild_status"
            fi

            e2e_started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "E2E_TESTS_START timestamp=$e2e_started_at"

            set +e
            make e2e FLAVOR=Staging
            e2e_status=$?
            set -e

            e2e_finished_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "E2E_TESTS_FINISH timestamp=$e2e_finished_at status=$e2e_status"
            exit "$e2e_status"

  apk-build:
    name: Build APK Staging (verificación)
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK
        env:
          AUTH0_DOMAIN_STAGING: ${{ secrets.AUTH0_DOMAIN_STAGING }}
          AUTH0_CLIENT_ID_STAGING: ${{ secrets.AUTH0_CLIENT_ID_STAGING }}
          AUTH0_AUDIENCE_STAGING: ${{ secrets.AUTH0_AUDIENCE_STAGING }}
          API_URL_STAGING: ${{ secrets.API_URL_STAGING }}
          AUTH0_SCHEME_STAGING: "com.loresuelvo.consumer.staging"
        run: make build FLAVOR=Staging

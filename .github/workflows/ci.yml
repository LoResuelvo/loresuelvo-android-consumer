name: CI Build & Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Path-sensor for the e2e job: the emulator boot costs ~5 min so
  # we only pay that on PRs that actually touch UI/Composable code,
  # the AndroidManifest, or the build configuration. Lint + unit
  # tests and the APK build verification are cheap enough to run
  # unconditionally.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            e2e:
              - 'app/src/main/**'
              - 'app/src/androidTest/**'
              - 'app/src/main/AndroidManifest.xml'
              - 'app/build.gradle.kts'
              - 'gradle/libs.versions.toml'
              - '.github/workflows/ci.yml'

  lint-and-unit:
    name: Lint + Unit Tests
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ejecutar Lint y Unit Tests
        env:
          AUTH0_DOMAIN_STAGING: ${{ secrets.AUTH0_DOMAIN_STAGING }}
          AUTH0_CLIENT_ID_STAGING: ${{ secrets.AUTH0_CLIENT_ID_STAGING }}
          AUTH0_AUDIENCE_STAGING: ${{ secrets.AUTH0_AUDIENCE_STAGING }}
          API_URL_STAGING: ${{ secrets.API_URL_STAGING }}
          AUTH0_SCHEME_STAGING: "com.loresuelvo.consumer.staging"
        run: |
          make lint FLAVOR=Staging
          make test FLAVOR=Staging

  e2e:
    name: Acceptance Tests (Emulator)
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Restore AVD cache
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/test.avd
            ~/.android/avd/test.ini
          key: ${{ runner.os }}-avd-api34-x86_64-pixel6-v1

      - name: Report AVD cache
        env:
          E2E_CACHE_HIT: ${{ steps.avd-cache.outputs.cache-hit == 'true' }}
        run: echo "E2E_CACHE_HIT=$E2E_CACHE_HIT"

      - name: Habilitar KVM (requerido por el emulador)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Ejecutar E2E (Android Instrumented Tests)
        uses: ReactiveCircus/android-emulator-runner@v2
        env:
          E2E_CACHE_HIT: ${{ steps.avd-cache.outputs.cache-hit == 'true' }}
          AUTH0_DOMAIN_STAGING: ${{ secrets.AUTH0_DOMAIN_STAGING }}
          AUTH0_CLIENT_ID_STAGING: ${{ secrets.AUTH0_CLIENT_ID_STAGING }}
          AUTH0_AUDIENCE_STAGING: ${{ secrets.AUTH0_AUDIENCE_STAGING }}
          API_URL_STAGING: ${{ secrets.API_URL_STAGING }}
          AUTH0_SCHEME_STAGING: "com.loresuelvo.consumer.staging"
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          avd-name: test
          force-avd-creation: false
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -snapshot ci-clean -no-snapshot-save
          script: |
            echo "E2E_CACHE_HIT=$E2E_CACHE_HIT"
            adb -s emulator-5554 emu avd snapshot list
            if [ "$E2E_CACHE_HIT" != "true" ]; then adb -s emulator-5554 emu avd snapshot save ci-clean; fi
            adb -s emulator-5554 emu avd snapshot list
            if adb -s emulator-5554 emu avd snapshot list | grep -q 'ci-clean'; then echo "E2E_SNAPSHOT_AVAILABLE=true"; else echo "E2E_SNAPSHOT_AVAILABLE=false"; echo "Expected snapshot ci-clean is unavailable"; exit 1; fi
            make e2e FLAVOR=Staging

  apk-build:
    name: Build APK Staging (verificación)
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK
        env:
          AUTH0_DOMAIN_STAGING: ${{ secrets.AUTH0_DOMAIN_STAGING }}
          AUTH0_CLIENT_ID_STAGING: ${{ secrets.AUTH0_CLIENT_ID_STAGING }}
          AUTH0_AUDIENCE_STAGING: ${{ secrets.AUTH0_AUDIENCE_STAGING }}
          API_URL_STAGING: ${{ secrets.API_URL_STAGING }}
          AUTH0_SCHEME_STAGING: "com.loresuelvo.consumer.staging"
        run: make build FLAVOR=Staging

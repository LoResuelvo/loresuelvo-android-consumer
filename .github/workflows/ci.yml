name: CI Build & Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Path-sensor for the instrumented-tests job: the emulator boot costs ~5 min so
  # we only pay that on PRs that actually touch UI/Composable code,
  # the AndroidManifest, or the build configuration. Lint + unit
  # tests and the APK build verification are cheap enough to run
  # unconditionally.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      instrumented: ${{ steps.filter.outputs.instrumented }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            instrumented:
              - 'app/src/main/**'
              - 'app/src/androidTest/**'
              - 'app/src/main/AndroidManifest.xml'
              - 'app/build.gradle.kts'
              - 'gradle/libs.versions.toml'
              - '.github/workflows/ci.yml'
              - 'makefile'
              - 'scripts/run_instrumented_tests.sh'

  lint-and-unit:
    name: Lint + Unit Tests
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Ejecutar Lint y Unit Tests
        env:
          AUTH0_DOMAIN_STAGING: ${{ secrets.AUTH0_DOMAIN_STAGING }}
          AUTH0_CLIENT_ID_STAGING: ${{ secrets.AUTH0_CLIENT_ID_STAGING }}
          AUTH0_AUDIENCE_STAGING: ${{ secrets.AUTH0_AUDIENCE_STAGING }}
          API_URL_STAGING: ${{ secrets.API_URL_STAGING }}
          AUTH0_SCHEME_STAGING: "com.loresuelvo.consumer.staging"
        run: |
          make lint FLAVOR=Staging
          make test FLAVOR=Staging

  instrumented-tests:
    name: Instrumented Tests (Emulator)
    needs: changes
    if: needs.changes.outputs.instrumented == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Habilitar KVM (requerido por el emulador)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Ejecutar tests instrumentados de Android
        env:
          GRADLE_OPTS: -Dorg.gradle.logging.level=info
          AUTH0_DOMAIN_STAGING: ${{ secrets.AUTH0_DOMAIN_STAGING }}
          AUTH0_CLIENT_ID_STAGING: ${{ secrets.AUTH0_CLIENT_ID_STAGING }}
          AUTH0_AUDIENCE_STAGING: ${{ secrets.AUTH0_AUDIENCE_STAGING }}
          API_URL_STAGING: ${{ secrets.API_URL_STAGING }}
          AUTH0_SCHEME_STAGING: "com.loresuelvo.consumer.staging"
        run: |
          echo "TIMING:INSTRUMENTED_TESTS_START=$(date -u +%s)"
          make instrumented FLAVOR=Staging
          echo "TIMING:INSTRUMENTED_TESTS_END=$(date -u +%s)"

      - name: Timing runner end
        if: always()
        run: echo "TIMING:RUNNER_END=$(date -u +%s)"

  apk-build:
    name: Build APK Staging (verificación)
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build APK
        env:
          AUTH0_DOMAIN_STAGING: ${{ secrets.AUTH0_DOMAIN_STAGING }}
          AUTH0_CLIENT_ID_STAGING: ${{ secrets.AUTH0_CLIENT_ID_STAGING }}
          AUTH0_AUDIENCE_STAGING: ${{ secrets.AUTH0_AUDIENCE_STAGING }}
          API_URL_STAGING: ${{ secrets.API_URL_STAGING }}
          AUTH0_SCHEME_STAGING: "com.loresuelvo.consumer.staging"
        run: make build FLAVOR=Staging
